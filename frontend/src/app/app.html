<div class="app-layout">
  <app-toast></app-toast>

  @if (showChrome()) {
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">🎓</span>
        <h2>CourseHub</h2>
      </div>

      <nav class="sidebar-nav">
        @if (!isAdmin) {
          <div class="nav-group">
            <span class="group-title">Menu</span>
            <a routerLink="/courses" routerLinkActive="active" class="nav-item">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              <span>All Courses</span>
            </a>
            <a routerLink="/my-courses" routerLinkActive="active" class="nav-item nav-with-badge">
              <div class="nav-label">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                <span>My Courses</span>
              </div>
              @if (enrolledCount > 0) {
                <span class="badge">{{ enrolledCount }}</span>
              }
            </a>
          </div>
        }

        @if (isAdmin) {
          <div class="nav-group">
            <span class="group-title">Admin</span>
            <a routerLink="/admin/courses" routerLinkActive="active" class="nav-item">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
              <span>Manage Courses</span>
            </a>
            <a routerLink="/admin/users" routerLinkActive="active" class="nav-item">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>Manage Users</span>
            </a>
          </div>
        }

        <div class="nav-group footer-group">
          <span class="group-title">Account</span>
          <a routerLink="/profile" routerLinkActive="active" class="nav-item">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>My Profile</span>
          </a>
          <button class="nav-item logout-btn" (click)="logout()">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Logout</span>
          </button>
        </div>
      </nav>
    </aside>
  }

  <main class="main-wrapper" [class.no-sidebar]="!showChrome()">
    <router-outlet></router-outlet>
  </main>
</div>
